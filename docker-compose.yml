version: '3.9'
networks:
  testes-docker.network:
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: testes-docker.app
    restart: unless-stopped #O contêiner será reiniciados em caso de falha ou reinicialização da máquina host. (NO, ALWAYS)
    volumes: #faz um mapeamento do diretorio local para um diretorio dentro do container
      - .:/var/www/html
      - ./apache/vhost.conf:/etc/apache2/sites-enabled/000-default.conf
      - ./apache/xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini 
    ports:
      - "8989:80"
      - "4321:443"
    depends_on:
      - postgres_db
    networks:
      - testes-docker.network
  postgres_db:
    image: postgres:15-alpine3.18
    container_name: testes-docker.postgres
    restart: unless-stopped #O contêiner será reiniciados em caso de falha ou reinicialização da máquina host. (NO, ALWAYS)
    ports:
      - 5451:5432
    expose:
      - "5432"
    environment:
      POSTGRES_DB: testes
      POSTGRES_USER: testes
      POSTGRES_PASSWORD: testes123456
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - testes-docker.network
volumes:
  postgres_data:
